[package]
name = "wtools"
version = "0.1.0"
description = "Lightweight launcher toolbox"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
nucleo-matcher = "0.3.1"
pinyin = "0.11.0"
plist = "1.10.4"
notify = "8.2.2"
rusqlite = "0.43.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
block2 = "0.6"
objc2 = "0.6.5"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder", "NSApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSPanel", "NSVisualEffectView", "NSBox", "NSImageView", "NSTextField", "NSEvent", "NSAppearance", "NSColor", "NSFont", "NSParagraphStyle", "NSText", "NSCell"] }
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSArray", "NSURL", "NSValue", "NSRange", "NSRegularExpression", "NSTextCheckingResult", "NSError"] }
objc2-natural-language = "0.3.2"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2-vision = "0.3.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
